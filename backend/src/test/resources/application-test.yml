spring:
  datasource:
    url: jdbc:h2:mem:eone;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
eone:
  storage:
    directory: target/upload-tests
  seed:
    enabled: false
  jwt:
    secret: test-secret-test-secret-test-secret-test-secret-1234567890
    access-minutes: 30
    refresh-days: 30
  cors:
    allowed-origins: http://localhost:8081
