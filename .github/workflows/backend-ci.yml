name: Backend CI
on:
  push:
    paths: ['backend/**', '.github/workflows/backend-ci.yml']
  pull_request:
    paths: ['backend/**', '.github/workflows/backend-ci.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: eone_test
          POSTGRES_USER: eone_test
          POSTGRES_PASSWORD: test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U eone_test -d eone_test"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      EONE_TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/eone_test
      EONE_TEST_DATABASE_USERNAME: eone_test
      EONE_TEST_DATABASE_PASSWORD: test-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test
        working-directory: backend
        run: mvn --batch-mode -Ppostgres verify
